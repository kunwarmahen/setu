[project]
name = "setu-sites"
version = "0.1.0"
description = "Sites with no API for a person -- Amazon, X -- signed in to in a window, used through a harness's browser"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["setu"]

# Manifests only: a browser-road site is data. There is no program here --
# the harness's own browser tools open the profile Setu signed in to.
[project.entry-points."setu.connectors"]
amazon = "setu_sites:AMAZON"
x = "setu_sites:X"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setu_sites"]
