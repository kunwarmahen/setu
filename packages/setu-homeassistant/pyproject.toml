[project]
name = "setu-homeassistant"
version = "0.1.0"
description = "Home Assistant for Setu -- see and control your home, two ways: its REST API or its own MCP server"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["setu", "mcp>=2.2,<3", "httpx>=0.28"]

[project.scripts]
setu-homeassistant = "setu_homeassistant.server:main"
setu-homeassistant-mcp = "setu_homeassistant.bridge:main"

# Two connectors, one package: the REST road, whose tools are ours, and a
# bridge to Home Assistant's own MCP server, whose tools are Home
# Assistant's. Each signs in on its own.
[project.entry-points."setu.connectors"]
homeassistant = "setu_homeassistant:MANIFEST"
homeassistant-mcp = "setu_homeassistant:MCP_MANIFEST"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setu_homeassistant"]
