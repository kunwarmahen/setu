# What Setu's Gmail connector is, in words a person can check before
# signing in. The levels are the whole promise: each names the exact
# Google permissions it will ask for, and nothing else is ever asked.
id = "gmail"
name = "Gmail"
summary = "Search and read your mail, see labels and drafts, write drafts, and -- only at the level that says so -- send."
road = "api"
auth = "google"
command = ["setu-gmail"]
api_base = "https://gmail.googleapis.com"
hosts = ["gmail.googleapis.com"]

# Which address a new sign-in belongs to -- asked of Gmail itself, so no
# extra "see your email address" permission is needed.
[whoami]
url = "https://gmail.googleapis.com/gmail/v1/users/me/profile"
field = "emailAddress"

[levels.read]
label = "Read only"
description = "Search and read mail, labels and drafts. Google itself refuses anything else."
scopes = ["https://www.googleapis.com/auth/gmail.readonly"]

[levels.draft]
label = "Read and draft"
description = "Everything in Read only, plus writing drafts that wait in your Drafts folder. Google's drafts permission also allows sending; at this level the connector offers no send, so a draft goes out only when you send it in Gmail."
scopes = [
    "https://www.googleapis.com/auth/gmail.readonly",
    "https://www.googleapis.com/auth/gmail.compose",
]

# Sending is asked for by name, so Google's consent screen says "Send
# email on your behalf" -- the person agrees to sending, not to drafts
# that happen to allow it.
[levels.send]
label = "Read, draft and send"
description = "Everything in Read and draft, plus sending email from your account. Every send is asked about first, goes to at most 20 people, carries no attachments, and one session sends at most 10."
scopes = [
    "https://www.googleapis.com/auth/gmail.readonly",
    "https://www.googleapis.com/auth/gmail.compose",
    "https://www.googleapis.com/auth/gmail.send",
]

[verbs]
search_threads = "read"
get_thread = "read"
get_message = "read"
list_labels = "read"
list_drafts = "read"
create_draft = "write"
send_message = "write"
