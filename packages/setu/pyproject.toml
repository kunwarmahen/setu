[project]
name = "setu"
version = "0.1.0"
description = "Setu -- sign in to a site once; the agents you allow can use it, and never see the key"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["httpx>=0.28", "cryptography>=42"]

[project.scripts]
setu = "setu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setu"]
